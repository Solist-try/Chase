<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Adventure! — Game</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/game.css" />
  </head>
  <body>
    <div class="game-page">
      <header class="hud" aria-label="Game status">
        <div class="hud__level">
          <p class="hud__label" id="level-name">Lime Meadow</p>
          <p class="hud__goal" id="level-goal">Collect the shiny stars!</p>
        </div>

        <div class="hud__meters" aria-live="polite">
          <div class="hud__stat" title="Stars collected">
            <span class="hud__icon hud__icon--star" aria-hidden="true">★</span>
            <span class="hud__stat-value">
              <span id="star-count">0</span><span id="star-total" class="hud__stat-total">/3</span>
            </span>
          </div>

          <div class="hud__stat" title="Coins collected">
            <span class="hud__icon hud__icon--coin" aria-hidden="true">◆</span>
            <span class="hud__stat-value">
              <span id="coin-count">0</span><span id="coin-total" class="hud__stat-total">/5</span>
            </span>
          </div>

          <div
            class="hud__stat hud__stat--hearts"
            title="Dragon health — always full and happy!"
            aria-label="3 full hearts"
          >
            <span class="hud__heart" aria-hidden="true">♥</span>
            <span class="hud__heart" aria-hidden="true">♥</span>
            <span class="hud__heart" aria-hidden="true">♥</span>
          </div>
        </div>

        <button type="button" class="hud__pause" id="pauseBtn">
          Pause
        </button>
      </header>

      <main class="game-stage">
        <canvas
          id="game-canvas"
          class="game-canvas"
          width="960"
          height="540"
          aria-label="Dragon Adventure game view"
        ></canvas>
      </main>
    </div>

    <script type="module" src="js/game.js"></script>
  </body>
</html>
