<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Adventure! — Paused</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/pause.css" />
  </head>
  <body>
    <main class="pause-page">
      <section class="pause-modal" aria-labelledby="pause-title" role="dialog" aria-modal="true">
        <header class="pause-modal__header">
          <p class="pause-modal__eyebrow">Take a breath</p>
          <h1 id="pause-title" class="pause-modal__title">Paused!</h1>
          <p class="pause-modal__lead">Cruul can wait — what would you like to do?</p>
        </header>

        <nav class="pause-modal__actions" aria-label="Pause menu">
          <a class="pause-btn pause-btn--resume" href="game.html">Resume</a>
          <a class="pause-btn pause-btn--restart" href="game.html?restart=1">Restart Level</a>
          <a class="pause-btn pause-btn--home" href="home.html">Back to Home</a>
        </nav>
      </section>
    </main>
  </body>
</html>
