<section class="page game-page" aria-label="Game">
  <header class="game-topbar">
    <div class="game-brand">
      <p class="game-kicker">Playing now</p>
      <h1 class="game-title">Dragon Adventure!</h1>
    </div>
    <button id="pauseBtn" class="btn btn-pause" type="button">Pause</button>
  </header>

  <div class="game-stage">
    <canvas
      id="gameCanvas"
      class="game-canvas"
      width="960"
      height="540"
      aria-label="Game canvas"
    ></canvas>
  </div>

  <p class="game-hint">Arrows / WASD move · Space jump · Reach the goal!</p>
</section>
