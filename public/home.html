<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Adventure! — Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/home.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <h1 class="title" aria-label="Dragon Adventure!">
          <span>D</span><span>r</span><span>a</span><span>g</span><span>o</span><span>n</span>
          <span class="space" aria-hidden="true"> </span>
          <span>A</span><span>d</span><span>v</span><span>e</span><span>n</span><span>t</span><span>u</span><span>r</span><span>e</span><span>!</span>
        </h1>
        <p class="tagline">A bright little quest for young explorers</p>
      </header>

      <main>
        <figure class="mascot">
          <!-- Cute dragon image placeholder (inline SVG until art is ready) -->
          <svg
            viewBox="0 0 280 220"
            width="280"
            height="220"
            role="img"
            aria-label="Cute dragon placeholder"
          >
            <title>Cute dragon placeholder</title>
            <ellipse cx="140" cy="198" rx="70" ry="12" fill="rgba(27,42,74,0.12)" />
            <path d="M88 110 C40 70 36 40 70 36 C86 56 92 82 96 108 Z" fill="#00BBF9" />
            <path d="M192 110 C240 70 244 40 210 36 C194 56 188 82 184 108 Z" fill="#80ED99" />
            <ellipse cx="130" cy="120" rx="58" ry="52" fill="#FF4D6D" />
            <ellipse cx="140" cy="130" rx="42" ry="36" fill="#FFE566" />
            <ellipse cx="188" cy="88" rx="36" ry="30" fill="#FF4D6D" />
            <ellipse cx="210" cy="96" rx="18" ry="12" fill="#FF9F1C" />
            <path d="M178 66 L186 38 L198 66 Z" fill="#B5179E" />
            <circle cx="180" cy="84" r="7" fill="#FFFAF0" />
            <circle cx="198" cy="82" r="7" fill="#FFFAF0" />
            <circle cx="182" cy="84" r="3.2" fill="#1B2A4A" />
            <circle cx="200" cy="82" r="3.2" fill="#1B2A4A" />
            <circle cx="172" cy="96" r="5" fill="#FF85A1" />
            <circle cx="208" cy="94" r="5" fill="#FF85A1" />
            <path
              d="M186 100 Q198 110 210 98"
              stroke="#1B2A4A"
              stroke-width="3"
              fill="none"
              stroke-linecap="round"
            />
            <path d="M110 96 L118 72 L128 96 Z" fill="#F72585" />
            <path d="M128 90 L136 68 L146 92 Z" fill="#F72585" />
            <path d="M148 88 L156 70 L164 92 Z" fill="#F72585" />
            <ellipse cx="112" cy="168" rx="16" ry="10" fill="#FF9F1C" />
            <ellipse cx="168" cy="168" rx="16" ry="10" fill="#FF9F1C" />
            <circle cx="64" cy="56" r="4" fill="#FFFF66" />
            <circle cx="230" cy="48" r="3" fill="#FFF" />
            <circle cx="248" cy="96" r="3.5" fill="#FFE566" />
          </svg>
          <figcaption>Your friendly dragon (image placeholder)</figcaption>
        </figure>

        <nav class="actions" aria-label="Home actions">
          <button type="button" class="btn btn--start" id="start-game">
            Start Game
          </button>
          <button
            type="button"
            class="btn btn--settings"
            id="open-settings"
            aria-expanded="false"
            aria-controls="settings-panel"
          >
            Settings
          </button>
        </nav>

        <section
          id="settings-panel"
          class="settings"
          hidden
          aria-label="Game settings"
        >
          <h2>Settings</h2>
          <p>Sound and difficulty options will live here for little explorers.</p>
          <button type="button" class="btn" id="close-settings">Done</button>
        </section>
      </main>
    </div>

    <script>
      const settingsPanel = document.getElementById('settings-panel');
      const openSettings = document.getElementById('open-settings');
      const closeSettings = document.getElementById('close-settings');
      const startGame = document.getElementById('start-game');

      function setSettingsOpen(open) {
        settingsPanel.hidden = !open;
        openSettings.setAttribute('aria-expanded', String(open));
      }

      openSettings.addEventListener('click', () => {
        setSettingsOpen(settingsPanel.hidden);
      });

      closeSettings.addEventListener('click', () => {
        setSettingsOpen(false);
      });

      startGame.addEventListener('click', () => {
        window.location.href = '/';
      });
    </script>
  </body>
</html>
