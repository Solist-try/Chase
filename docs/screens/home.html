<section class="page home-page" aria-label="Home">
  <header class="home-hero">
    <p class="home-kicker">Welcome, brave explorer!</p>
    <h1 class="home-title">Dragon Adventure!</h1>
    <p class="home-subtitle">
      Customize your dragon, race through bright levels, and collect shiny stars.
    </p>
  </header>

  <div class="home-actions">
    <button id="startBtn" class="btn btn-primary" type="button" onclick="startGame()">
      Start Game
    </button>
    <button id="settingsBtn" class="btn btn-secondary" type="button">Settings</button>
  </div>

  <p class="home-hint">Tip: Use arrows or WASD to move. Space jumps!</p>
</section>
