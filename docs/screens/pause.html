<section class="page pause-page" aria-label="Pause">
  <div class="pause-modal" role="dialog" aria-labelledby="pauseTitle" aria-modal="true">
    <p class="pause-kicker">Take a breath</p>
    <h1 id="pauseTitle" class="pause-title">Paused</h1>
    <p class="pause-text">Your dragon is waiting. What would you like to do?</p>

    <div class="pause-actions">
      <button id="resumeBtn" class="btn btn-primary" type="button">Resume</button>
      <button id="restartBtn" class="btn btn-secondary" type="button">Restart</button>
      <button id="homeBtn" class="btn btn-ghost" type="button">Home</button>
    </div>
  </div>
</section>
