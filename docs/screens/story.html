<section class="page story-page" aria-label="Story">
  <header class="story-hero">
    <p class="story-kicker">Chapter One</p>
    <h1 class="story-title">Meet Your Dragon</h1>
    <p class="story-text">
      A friendly dragon needs your help! Pick a bright look, then race through
      sunny meadows, crystal caves, and a glowing sky path. Collect stars, avoid
      spikes, and reach the goal.
    </p>
  </header>

  <div class="story-actions">
    <button
      id="nextBtn"
      class="btn btn-primary"
      type="button"
      onclick="navigateTo('game')"
    >
      Start Level
    </button>
    <button
      id="backBtn"
      class="btn btn-secondary"
      type="button"
      onclick="navigateTo('home')"
    >
      Back
    </button>
  </div>
</section>
