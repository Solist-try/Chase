<section class="page game-page" aria-label="Level 2">
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite">
    <p class="loading-screen__kicker">Get ready!</p>
    <h1 class="loading-screen__title">Level 2</h1>
    <p class="loading-screen__text">Rainbow path ahead…</p>
    <div class="loading-screen__spinner" aria-hidden="true"></div>
  </div>

  <header id="gameHud" class="hud is-hidden" hidden>
    <div class="hud__level">
      <p id="levelName" class="hud__label">Level 2</p>
      <p id="levelGoal" class="hud__goal">Ride the moving platform!</p>
    </div>

    <div class="hud__meters">
      <div class="hud__stat hud__stat--hearts" aria-label="Hearts" id="heartMeter">
        <span class="hud__heart" aria-hidden="true">♥</span>
        <span class="hud__heart" aria-hidden="true">♥</span>
      </div>
      <div class="hud__stat" aria-label="Stars">
        <span class="hud__icon hud__icon--star" aria-hidden="true"></span>
        <span id="starCount" class="hud__stat-value">0</span>
        <span class="hud__stat-total">/4</span>
      </div>
      <div class="hud__stat" aria-label="Coins">
        <span class="hud__icon hud__icon--coin" aria-hidden="true"></span>
        <span id="coinCount" class="hud__stat-value">0</span>
        <span class="hud__stat-total">/4</span>
      </div>
      <button id="pauseBtn" class="hud__pause" type="button">Pause</button>
    </div>
  </header>

  <div id="gameStage" class="game-stage is-hidden" hidden>
    <canvas id="gameCanvas" class="game-canvas"></canvas>
  </div>

  <div id="touchControls" class="touch-controls" hidden aria-label="Game controls">
    <div class="touch-controls__move">
      <button id="touchLeft" class="touch-btn touch-btn--move" type="button" aria-label="Move left">
        ◀
      </button>
      <button id="touchRight" class="touch-btn touch-btn--move" type="button" aria-label="Move right">
        ▶
      </button>
    </div>
    <button id="touchJump" class="touch-btn touch-btn--jump" type="button" aria-label="Jump">
      Jump
    </button>
  </div>

  <div id="winOverlay" class="win-menu" hidden>
    <h2>You win!</h2>
    <p>Level 2 complete — you rode the rainbow!</p>
    <div class="win-menu__actions">
      <button id="winAgainBtn" class="win-menu__btn win-menu__btn--again" type="button">
        Play again
      </button>
      <button id="winHomeBtn" class="win-menu__btn win-menu__btn--home" type="button">
        Home
      </button>
    </div>
  </div>

  <div id="loseOverlay" class="win-menu" hidden>
    <h2>Oh no!</h2>
    <p>The special foe touched you twice. Jump on its head next time!</p>
    <div class="win-menu__actions">
      <button id="loseAgainBtn" class="win-menu__btn win-menu__btn--again" type="button">
        Try again
      </button>
      <button id="loseHomeBtn" class="win-menu__btn win-menu__btn--home" type="button">
        Home
      </button>
    </div>
  </div>

  <div id="pauseOverlay" class="pause-menu" hidden>
    <h2>Paused</h2>
    <p>Your dragon is waiting. What would you like to do?</p>
    <div class="pause-menu__actions">
      <button id="resumeBtn" class="pause-menu__btn pause-menu__btn--resume" type="button">
        Resume
      </button>
      <button id="restartBtn" class="pause-menu__btn pause-menu__btn--restart" type="button">
        Restart
      </button>
      <button id="homeBtn" class="pause-menu__btn pause-menu__btn--home" type="button">
        Home
      </button>
    </div>
  </div>

  <!-- Boots Level 2 after the screen HTML is in #app -->
  <script type="module" src="js/level2.js"></script>
</section>
