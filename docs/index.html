<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 30px;
            font-weight: bold;
            background: linear-gradient(90deg, 
                #FF0000 0%, 
                #FF7F00 16.66%, 
                #FFFF00 33.32%, 
                #00FF00 49.98%, 
                #0000FF 66.64%, 
                #4B0082 83.3%, 
                #9400D3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow-glow 3s ease-in-out infinite;
        }

        @keyframes rainbow-glow {
            0%, 100% {
                filter: brightness(1);
            }
            50% {
                filter: brightness(1.2);
            }
        }

        .dragon-placeholder {
            width: 200px;
            height: 200px;
            margin: 30px auto;
            background: linear-gradient(135deg, #ff6b9d 0%, #ffd93d 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            animation: float 3s ease-in-out infinite;
            border: 5px solid #ff4757;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .start-button {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff4757 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 71, 87, 0.3);
        }

        .start-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 71, 87, 0.5);
            background: linear-gradient(135deg, #ff4757 0%, #ff3838 100%);
        }

        .start-button:active {
            transform: translateY(-1px);
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐉 Dragon Adventure! 🐉</h1>
        <p class="subtitle">Embark on an epic quest with the mighty dragon</p>
        
        <div class="dragon-placeholder">
            🐉
        </div>
        
        <button class="start-button" onclick="startGame()">Start Game</button>
    </div>

    <script>
        function startGame() {
            alert('🐉 Adventure awaits! Game starting...');
            // Add your game logic here
        }
    </script>
</body>
</html>
